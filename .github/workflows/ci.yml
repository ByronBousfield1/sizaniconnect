# Continuous integration: every push to a working branch and every pull request into develop or main.
# The same workflow is called by deploy.yml, so nothing reaches Azure without passing these gates.
name: CI

on:
  push:
    branches: [develop, 'feature/**', 'hotfix/**', 'release/**']
  pull_request:
    branches: [develop, main]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API (lint, types, unit and integration tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sizani
          POSTGRES_PASSWORD: sizani
          POSTGRES_DB: sizani_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U sizani"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://sizani:sizani@localhost:5432/sizani_test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: api/package-lock.json
      - run: npm ci
      - name: Lint (includes the no-interpolated-SQL rule)
        run: npm run lint
      - run: npm run typecheck
      - name: Tests against real PostgreSQL, with the 70% coverage gate (NFR-18)
        run: npm run test:coverage
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: api-coverage
          path: api/coverage/lcov.info
          retention-days: 14

  web:
    name: Web (lint, types, component tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Lint (fails on dangerouslySetInnerHTML and innerHTML)
        run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  e2e:
    name: End-to-end and accessibility
    # A real browser against the built app and a freshly seeded database: user journeys for every
    # role, the event-desk acceptance criteria (including damaged QR scans and camera scanning on a
    # CPU-throttled phone), failure handling, and WCAG 2.1 AA checks with axe-core (NFR-10).
    needs: [api, web]
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sizani
          POSTGRES_PASSWORD: sizani
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U sizani"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      E2E_DATABASE_URL: postgresql://sizani:sizani@localhost:5432/sizani_e2e
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Build the API and the web app
        run: |
          (cd api && npm ci && npm run build)
          (cd web && npm ci && npm run build)
      - name: Install Chromium, and ffmpeg for the fake camera feed
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium
          sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Run the browser tests
        working-directory: e2e
        run: npx playwright test
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 14

  dependencies:
    name: Dependency audit (T-11)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Fail on high or critical advisories in production dependencies
        run: |
          (cd api && npm audit --omit=dev --audit-level=high)
          (cd web && npm audit --omit=dev --audit-level=high)
